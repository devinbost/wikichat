version: "0.4.12"

networks:
  langflow-network:
    driver: bridge

services:
  registry:
    image: registry:2
    ports:
      - "5000:5000"
    networks:
      - langflow-network
  langflow:
    user: "0:0"  # Run as root
    build:
      context: .
      dockerfile: Dockerfile.langflow
    image: localhost:5000/langflow-sia:v1.1.0
    ports:
      - "7860:7860"
    depends_on:
      - postgres
      - registry
    command: ["python", "-m", "langflow", "run", "--env-file", "/app/.env", "--host", "0.0.0.0", "--port", "7860"]
    working_dir: /app
    environment:
#      - LANGFLOW_DATABASE_URL=postgresql://langflow:langflow@postgres:5432/langflow
      - LANGFLOW_LANGCHAIN_CACHE=InMemoryCache
      - LANGFLOW_WORKERS=1
     # - LANGFLOW_BACKEND_ONLY=true
      - LANGFLOW_STORE_ENVIRONMENT_VARIABLES=true
      - LANGFLOW_VARIABLES_TO_GET_FROM_ENVIRONMENT=HUGGINGFACE_MODEL_PATH,CASSANDRA_CONTACT_POINTS,CASSANDRA_USERNAME,CASSANDRA_PASSWORD,CASSANDRA_DATA_ENDPOINT,CASSANDRA_COLLECTION,REST_API_KEY,REST_LSL_KEY,REST_ENDPOINT,ASTRA_DB_TOKEN,ASTRA_DB_DATABASE_ID,MYSQL_DB,MYSQL_USER,MYSQL_PASSWORD,MYSQL_HOST,OLLAMA_HOST
      - COLUMNS=200
      - LANGFLOW_LOAD_FLOWS_PATH=/app/flows
    volumes:
      - ./langflow-tmp/langflow-data:/app/langflow
      - ./langflow-tmp/langflow-app-data:/app/data
      - ./huggingface/huggingface:/app/huggingface
      - ./.env.production:/app/.env
      - ./flows:/app/flows
      - ./langflow-tmp/cache:/app/data/.cache
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - langflow-network
    env_file:
      - .env.production 

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: langflow
      POSTGRES_PASSWORD: langflow
      POSTGRES_DB: langflow
    ports:
      - "5432:5432"
    volumes:
      - ./langflow-tmp/langflow-postgres:/var/lib/postgresql/data
    networks:
      - langflow-network

  nextjs-app:
    environment:
    - HOST=0.0.0.0
    - PORT=3000
    build:
      context: .
      dockerfile: Dockerfile.app
    image: localhost:5000/nextjs-app-sia:latest
    ports:
      - "3000:3000"
    depends_on:
      - langflow
    volumes:
    - ./.env.production:/app/.env.production
    networks:
      - langflow-network
    env_file:
      - .env.production 
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_HOME=/root/.ollama
    volumes:
      - ./models/models:/root/.ollama/models
    networks:
      - langflow-network
    entrypoint: ["ollama", "serve"]  

volumes:
  langflow-postgres:
  langflow-data: