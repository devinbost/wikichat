version: "0.4.12"

networks:
  langflow-network:
    driver: bridge

services:
  registry:
    image: registry:2
    ports:
      - "5000:5000"
    networks:
      - langflow-network
  langflow:
    build:
      context: .
      dockerfile: Dockerfile.langflow
    image: localhost:5000/langflow-sia:latest
    ports:
      - "7860:7860"
    depends_on:
      - postgres
    environment:
      - LANGFLOW_DATABASE_URL=postgresql://langflow:langflow@postgres:5432/langflow
      - LANGFLOW_LANGCHAIN_CACHE=InMemoryCache
      - LANGFLOW_WORKERS=1
      - LANGFLOW_BACKEND_ONLY=true
      - LANGFLOW_STORE_ENVIRONMENT_VARIABLES=true
      - LANGFLOW_VARIABLES_TO_GET_FROM_ENVIRONMENT=HUGGINGFACE_MODEL_PATH,CASSANDRA_CONTACT_POINTS,CASSANDRA_USERNAME,CASSANDRA_PASSWORD,CASSANDRA_DATA_ENDPOINT,CASSANDRA_COLLECTION,REST_API_KEY,REST_LSL_KEY,REST_ENDPOINT,ASTRA_DB_TOKEN,ASTRA_DB_DATABASE_ID,MYSQL_DB,MYSQL_USER,MYSQL_PASSWORD,MYSQL_HOST
    volumes:
      - ./langflow-data:/app/langflow
      - ./huggingface:/app/huggingface
      - ./.env.production:/app/.env
      - ./flows:/app/flows
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - langflow-network

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: langflow
      POSTGRES_PASSWORD: langflow
      POSTGRES_DB: langflow
    ports:
      - "5432:5432"
    volumes:
      - langflow-postgres:/var/lib/postgresql/data
    networks:
      - langflow-network

  nextjs-app:
    environment:
    - HOST=0.0.0.0
    - PORT=3000
    - DEBUG=next:*
    - DEFAULT_ADMIN_PASSWORD="Test1234@#"
    - DEFAULT_ADMIN_EMAIL=superadmin@localhost.com
    build:
      context: .
      dockerfile: Dockerfile.app
    image: localhost:5000/nextjs-app-sia:latest
    ports:
      - "3000:3000"
    depends_on:
      - langflow
    networks:
      - langflow-network
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_HOME=/root/.ollama
    volumes:
      - ./models:/root/.ollama/models
    networks:
      - langflow-network
    entrypoint: ["ollama", "serve"]  
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: "Mysql!@#"
      MYSQL_DATABASE: "MYSQL"
    volumes:
      - ./mysql-init:/docker-entrypoint-initdb.d
    ports:
      - "3306:3306"
    networks:
      - langflow-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  langflow-postgres:
  langflow-data: